<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Central box - Anthropic coral -->
  <rect x="9" y="9" width="14" height="14" rx="3" fill="#da7756"/>

  <!-- Route arrows - 3 directions for visual balance -->
  <!-- Top route -->
  <path d="M16 9 L16 2" stroke="#da7756" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="2" r="2" fill="#da7756"/>

  <!-- Bottom-left route -->
  <path d="M11 21 L4 28" stroke="#da7756" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="3" cy="29" r="2" fill="#da7756"/>

  <!-- Bottom-right route -->
  <path d="M21 21 L28 28" stroke="#da7756" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="29" cy="29" r="2" fill="#da7756"/>

  <!-- Inner highlight -->
  <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#e08a6c" opacity="0.5"/>
</svg>
