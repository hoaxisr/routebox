# RouteBox Configuration
# =====================
# This file configures the RouteBox WebUI application.
# Place this file next to the routebox binary or specify path with --settings flag.
#
# All paths can be absolute or relative to the binary location.
# Settings marked with [runtime] can be changed without restart.
# Settings marked with [restart] require application restart to take effect.

# =============================================================================
# GeoIP Configuration
# =============================================================================
# GeoIP enrichment adds country flags and network information to connections.
# Supports MaxMind and IPInfo MMDB format databases.

[geoip]
# Path to the MMDB database file.
# Recommended: IPInfo Lite (free) or MaxMind GeoLite2
# Download: https://ipinfo.io/developers/free-ip-database
# Leave empty to disable GeoIP features.
# [restart]
path = ""

# Enable or disable GeoIP enrichment for connections.
# When disabled, the database stays loaded but enrichment is skipped.
# [runtime]
enabled = true

# Automatically reload database when file changes.
# Useful for automated database updates via cron.
# [runtime]
auto_reload = false

# =============================================================================
# User Interface
# =============================================================================
# UI appearance and behavior settings.

[ui]
# Default color theme for new users.
# Values: "dark", "light", "system"
# Users can override this in their browser.
# [runtime]
theme = "system"

# Interface language.
# Values: "en", "ru"
# [runtime]
language = "en"

# Show connection speed in bits (Mbps) or bytes (MB/s).
# Values: "bits", "bytes"
# [runtime]
speed_unit = "bytes"

# Date/time format.
# Values: "relative" (5m ago), "absolute" (14:32:15), "both"
# [runtime]
time_format = "relative"

# =============================================================================
# Monitoring
# =============================================================================
# Settings for the monitoring features (connections, traffic, logs).

[monitoring]
# Enable GeoIP enrichment for connection data.
# Requires [geoip] to be configured.
# [runtime]
enrichment_enabled = true

# Maximum number of closed connections to keep in history.
# Higher values use more memory. Set to 0 to disable history.
# [runtime]
max_closed_connections = 500

# Interval for polling status when WebSocket is unavailable (milliseconds).
# [runtime]
poll_interval_ms = 2000

# Auto-refresh interval for proxies page (milliseconds).
# Set to 0 to disable auto-refresh.
# [runtime]
proxies_refresh_ms = 5000

# =============================================================================
# Logging
# =============================================================================
# RouteBox application logging (not sing-box logs).

[logging]
# Log level for RouteBox application.
# Values: "debug", "info", "warn", "error"
# [restart]
level = "info"

# Log output destination.
# Values: "stdout", "stderr", or a file path
# [restart]
output = "stdout"

# Include timestamps in log output.
# [restart]
timestamps = true

# Log format.
# Values: "text", "json"
# [restart]
format = "text"

# =============================================================================
# Security
# =============================================================================
# Access control and security settings.

[security]
# Enable basic authentication for the web interface.
# When enabled, users must provide username/password.
# [restart]
auth_enabled = false

# Username for basic auth (only used if auth_enabled = true).
# [restart]
auth_username = ""

# Password for basic auth (only used if auth_enabled = true).
# Consider using environment variable ROUTEBOX_AUTH_PASSWORD instead.
# [restart]
auth_password = ""

# Allowed origins for CORS (comma-separated).
# Use "*" to allow all origins (default, for local network use).
# [restart]
cors_origins = "*"

# Session timeout in minutes (0 = no timeout).
# [runtime]
session_timeout_minutes = 0

# =============================================================================
# Network
# =============================================================================
# Network-related settings.

[network]
# HTTP listen address.
# Use "0.0.0.0:8080" to listen on all interfaces.
# Use "127.0.0.1:8080" to only allow local connections.
# [restart]
listen = "0.0.0.0:8080"

# Read timeout for HTTP requests (seconds).
# [restart]
read_timeout_sec = 30

# Write timeout for HTTP responses (seconds).
# [restart]
write_timeout_sec = 30

# Enable gzip compression for responses.
# [restart]
compression_enabled = true

# =============================================================================
# Sing-box Integration
# =============================================================================
# Settings for sing-box/amnezia-box process management.

[singbox]
# Path to sing-box configuration file.
# Leave empty for auto-detection from running process.
# [restart]
config_path = ""

# Override Clash API address.
# Leave empty to auto-detect from sing-box config.
# Format: "host:port" (e.g., "127.0.0.1:9090")
# [restart]
clash_api = ""

# Binary name to search for.
# [restart]
binary_name = "amnezia-box"

# Systemd service name (if managed by systemd).
# Leave empty for auto-detection.
# [restart]
service_name = ""

# =============================================================================
# Advanced
# =============================================================================
# Advanced settings for power users.

[advanced]
# Enable debug endpoints (/api/debug/*).
# WARNING: May expose sensitive information.
# [restart]
debug_endpoints = false

# Enable pprof profiling endpoints.
# [restart]
pprof_enabled = false

# Maximum request body size in bytes (default: 10MB).
# [restart]
max_body_size = 10485760

# WebSocket ping interval (seconds).
# [runtime]
ws_ping_interval_sec = 30

# WebSocket pong timeout (seconds).
# [runtime]
ws_pong_timeout_sec = 10
