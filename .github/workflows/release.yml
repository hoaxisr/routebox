# Release pipeline: push a version tag (v1.2.3) and this builds the panel
# (frontend embedded into the Go binary), runs the full test suite as a gate,
# publishes routebox-linux-{amd64,arm64} + .sha256 sidecars (the exact asset
# names install.sh and the in-app self-updater download), builds the dest web
# server (routebox-dest-linux-{amd64,arm64}) and packs the stub sites
# (routebox-stubs.tar.gz) the out-of-the-box install needs, fills the release
# body with the tag's CHANGELOG.md section via .github/scripts/extract-changelog.sh,
# and (once that succeeds) builds+pushes the multi-arch Docker image.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release + upload assets
  packages: write # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog fallback needs tags + history (git describe)

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      # go:embed all:dist compiles the SPA into the binary — the dist dir is
      # gitignored (only .gitkeep), so populate it from the fresh build.
      - name: Embed frontend into the Go binary
        run: |
          rm -rf backend/internal/embedded/dist
          mkdir -p backend/internal/embedded/dist
          cp -r frontend/build/. backend/internal/embedded/dist/

      - name: Backend tests
        run: |
          go vet ./backend/...
          go test ./backend/...

      # CGO_ENABLED=0: all deps are pure Go (modernc.org/sqlite), so the binary
      # is static and runs on any glibc/musl box. Version is stamped the way
      # main.go expects (-X main.Version, no leading "v").
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "dist/routebox-linux-${arch}" ./backend/cmd/routebox
          done

      # dest — the web server the out-of-the-box install puts in front of the
      # panel (ADR 0002). It ships prebuilt because handing an operator's
      # production box a Go toolchain to compile a web server is not something
      # an install script gets to do. The fork matters: upstream forwardproxy
      # does not speak naive. So does the `=` replace — klzgrad's fork still
      # declares the upstream module path, and xcaddy refuses --with without it.
      - name: Build dest (Caddy + naive forwardproxy)
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              "$(go env GOPATH)/bin/xcaddy" build v2.11.4 \
              --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive \
              --output "dist/routebox-dest-linux-${arch}"
          done

      # The stub sites dest serves at the domain root. One archive, one
      # directory per template — the installer picks one at random.
      - name: Pack stub templates
        run: tar czf dist/routebox-stubs.tar.gz stubs

      - name: Checksum artifacts
        working-directory: dist
        run: |
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Build release notes
        run: |
          ./.github/scripts/extract-changelog.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          echo "----- release body -----"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*

  docker:
    needs: release # only build the image once the binary release+tests are green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the buildx build below

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows stable releases only: a prerelease tag (v1.2.3-beta.1)
      # publishes its own version tag and leaves `latest` where it was, so
      # nobody tracking `latest` is moved onto a beta by a tag push.
      - name: Resolve version and tags
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # Derived from the repository rather than hardcoded, so a fork can tag
          # and exercise this whole job against its own GHCR namespace. On this
          # repository it resolves to exactly what it always was. GHCR requires
          # the name to be lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$version"
          case "$version" in
            *-*) echo "prerelease: $version — not tagging latest" ;;
            *)   tags="$tags"$'\n'"$image:latest" ;;
          esac
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROUTEBOX_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.version.outputs.tags }}
