# CI gate for the development branch: the same checks the release pipeline
# runs, minus the binary build/publish, so a red tag build is never a surprise.
name: CI

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Several tests hand a generated config to the real binary — the only way
      # to catch what sing-box refuses to START on (deprecations turned fatal,
      # rule shapes it rejects) rather than what our own validator knows about.
      # They t.Skip without a binary, so before this step they never ran here and
      # a config the panel produced but the box would not load shipped twice.
      # Best-effort: a GitHub API hiccup must not turn the whole CI red, it just
      # puts those tests back to skipping.
      - name: Install amnezia-box for the config-check tests
        continue-on-error: true
        run: |
          set -e
          rel=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hoaxisr/amnezia-box/releases/latest)
          url=$(echo "$rel" | jq -r '[.assets[] | select(.name | endswith("linux-amd64"))][0].browser_download_url')
          sha=$(echo "$rel" | jq -r '[.assets[] | select(.name | endswith("linux-amd64.sha256"))][0].browser_download_url')
          curl -fsSL -o /tmp/amnezia-box "$url"
          curl -fsSL -o /tmp/amnezia-box.sha256 "$sha"
          echo "$(cut -d' ' -f1 /tmp/amnezia-box.sha256)  /tmp/amnezia-box" | sha256sum -c -
          install -m 0755 /tmp/amnezia-box /usr/local/bin/amnezia-box
          amnezia-box version
      - name: Vet, test, build
        run: |
          go vet ./backend/...
          go test ./backend/...
          CGO_ENABLED=0 go build ./backend/cmd/routebox

  docker:
    # The image is only built by the release pipeline, which runs after the
    # binaries are published — a Dockerfile mistake would surface with the
    # release already out. Build it here on the same events that gate the code,
    # amd64 only and without pushing: the cross-compiling stages are the ones
    # that can break, and arm64 differs only in GOARCH.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3 # for the arm64 tools build below
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            ROUTEBOX_VERSION=ci
          tags: routebox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: docker run --rm --entrypoint /usr/bin/routebox routebox:ci version
      # amneziawg-tools is the one thing compiled for the TARGET arch rather than
      # cross-compiled, so an amd64-only build says nothing about arm64. Just the
      # stage: it fails in seconds if the sources or toolchain drift.
      - name: Build amneziawg-tools for arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          target: awg-tools
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
